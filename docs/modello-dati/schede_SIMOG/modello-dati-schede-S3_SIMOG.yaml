openapi: 3.0.0
info:
  title: Modello Dati - Scheda S3_SIMOG - Scheda relativa agli incarichi tecnici e alle prestazioni progettuali.
  version: 1.0.0
components:
  schemas:
    ElencoIncarichiType:
      description: Dati relativi agli incarichi.
      type: object
      additionalProperties: false
      required: [cig]
      properties:
        cig:
          description: codice identificativo lotto
          type: string            
        incarichi:
          type: array
          items:        
            $ref: 'https://raw.githubusercontent.com/anticorruzione-test/npa/appalti/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/Incarico_SIMOGType'   
    AnacFormS3Type:
      description: Dati relativi agli incarichi tecnici e alle prestazioni progettuali.
      type: object
      additionalProperties: false
      required: [elencoIncarichi]
      properties:
        elencoIncarichi:
          type: array
          items:        
            $ref: '#/components/schemas/ElencoIncarichiType'  
    SchedaS3_SIMOGType:
      description: Elenco dei soggetti incaricati della progettazione.
      type: object
      required: [anacForm]
      additionalProperties: false
      properties:
        anacForm:
          $ref: '#/components/schemas/AnacFormS3_SIMOGType'        