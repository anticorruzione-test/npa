openapi: 3.0.0
info:
  title: Modello Dati - Scheda SC1_1 - Scheda di sottoscrizione del contratto in caso di anticipata esecuzione
  version: 1.0.0
components:
  schemas:
    DatiContrattoType:
      description: Oggetto che riporta i dati di sottoscrizione del contratto in caso di anticipata esecuzione
      type: object
      additionalProperties: false
      required: [importoCauzione,dataDecorrenza,dataScadenza]
      properties:
        dataStipula:
          description: Data stipula del contratto
          type: string
          format: date-time            
        dataEsecutivita:
          description: Data esecutività del contratto (ove prevista)
          type: string
          format: date-time
        dataDecorrenza:
          description: Data di decorrenza contrattuale
          type: string
          format: date-time 
        dataScadenza:
          description: Data di scadenza contrattuale
          type: string
          format: date-time          
        importoCauzione:
          description: Importo cauzione definitiva in €
          type: number
          format: double
    AnacFormSC1_1Type:
      description: Contiene tutti i dati di sottoscrizione del contratto
      type: object
      additionalProperties: false
      required: [idContratto, datiContratto]
      properties:
        idContratto:
          description: identificativo del contratto restituito in response alla scheda di Sottoscrizione del contratto.
          type: string   
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"      
        datiContratto:
          $ref: '#/components/schemas/DatiContrattoType'
    SchedaSC1_1Type:
      description: Sottoscrizione del contratto 
      type: object
      required: [anacForm]
      additionalProperties: false
      properties:
        anacForm:
          $ref: '#/components/schemas/AnacFormSC1_1Type'