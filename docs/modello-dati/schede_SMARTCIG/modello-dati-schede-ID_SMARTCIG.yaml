openapi: 3.0.0
info:
  title: Modello Dati - Scheda ID_SMARTCIG - Scheda  per l'integrazione dei dati delle procedure SmartCIG.
  version: 1.0.0
components:
  schemas:
    ComunicazioneCUPType:
      description: Dati inerenti la modifica del CUP
      type: object
      required: [motivoVariazioneCUP,cup]
      additionalProperties: false
      properties:
        motivoVariazioneCUP:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MotivoVariazioneCUPEnum'    
        cup:
          description: Cup
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9]{15}$    
    ComunicazioneIDType:
      type: object
      required: [motivoRichiestaModifica]
      additionalProperties: false
      properties:
        motivoRichiestaModifica:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MotivoRichiestaModifica_SMARTCIGEnum'    
        comunicazioneCUP:
            $ref: '#/components/schemas/ComunicazioneCUPType'
        importo:
          description: importo
          type: number
          format: double
        oggettoContratto:
          $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/OggettoContrattoEnum'
    AnacFormID_SMARTCIGType:
      type: object
      required: [cig,comunicazione]
      additionalProperties: false
      properties:
        cig:
          description: codice identificativo lotto
          type: string 
        comunicazione:
            $ref: '#/components/schemas/ComunicazioneIDType'    
    SchedaID_SMARTCIGType:
      description: Scheda per l'integrazione dei dati delle procedure SmartCIG.
      type: object
      required: [anacForm]
      additionalProperties: false
      properties:
        anacForm:
          $ref: '#/components/schemas/AnacFormID_SMARTCIGType'
